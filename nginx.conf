server {
    listen 80;
    server_name localhost;

    # Prevent API endpoints from accidentally returning frontend index.html
    location /api/ {
        default_type application/json;
        return 404 '{"detail": "Not Found: API requests must be directed to the FastAPI backend service"}';
    }

    location /ws/ {
        default_type application/json;
        return 404 '{"detail": "Not Found: WebSocket requests must be directed to the FastAPI backend service"}';
    }

    location /docs {
        default_type application/json;
        return 404 '{"detail": "Not Found: Swagger documentation is hosted on the FastAPI backend service"}';
    }

    location /openapi.json {
        default_type application/json;
        return 404 '{"detail": "Not Found: OpenAPI schema is hosted on the FastAPI backend service"}';
    }

    # React Single Page Application (SPA) routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
