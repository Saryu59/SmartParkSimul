version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: smartpark_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartpark
      POSTGRES_PASSWORD: smartpark_secret_password
      POSTGRES_DB: smartpark_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpark -d smartpark_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartpark_backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: "SmartPark IoT Backend"
      ENVIRONMENT: "production"
      DATABASE_URL: "postgresql+asyncpg://smartpark:smartpark_secret_password@db:5432/smartpark_db"
      DATABASE_URL_SYNC: "postgresql://smartpark:smartpark_secret_password@db:5432/smartpark_db"
      SECRET_KEY: "change_me_to_a_secure_random_production_secret_key"
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:5173", "http://127.0.0.1:5173"]'
      SENSOR_MODE: "demo"
      HARDWARE_DEVICE_TOKEN: "esp32_secure_token_smartpark_2026"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8000/api/v1"
        VITE_WS_URL: "ws://localhost:8000/ws/live"
        VITE_DEMO_MODE: "false"
    container_name: smartpark_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
